name: AI sửa sai
description: Báo câu đúng bị sửa hoặc câu sai chưa được sửa đúng
title: '[Sửa câu] '
body:
  - type: textarea
    id: input
    attributes:
      label: Câu đã nhập và phản hồi thực tế
      description: Dùng câu ví dụ, bỏ thông tin cá nhân.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và giải thích
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model, nhà cung cấp, trình độ và commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cách tái hiện (gõ hay nhận dạng giọng nói, hệ điều hành)
